[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-copilot"
version = "0.1.0"
description = "Windows-first foundation for Conversation Copilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["conversation_copilot"]

[tool.setuptools.package-data]
conversation_copilot = ["demo/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
