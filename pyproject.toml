[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-copilot"
version = "0.1.0"
description = "Windows-first foundation for Conversation Copilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av==18.1.0",
    "PyAudioWPatch==0.2.12.8; sys_platform == 'win32'",
    "ctranslate2==4.8.1",
    "faster-whisper==1.2.1",
    "mediapipe==1.0.0",
    "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32'",
    "nvidia-cuda-nvrtc-cu12==12.9.86; sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.24.0.43; sys_platform == 'win32'",
    "numpy==2.5.2",
    "opencv-contrib-python==5.0.0.93",
    "openai>=2.54,<3",
    "pydantic>=2,<3",
    "winrt-runtime==3.2.1",
    "winrt-Windows.Foundation==3.2.1",
    "winrt-Windows.Graphics==3.2.1",
    "winrt-Windows.Graphics.Capture==3.2.1",
    "winrt-Windows.Graphics.Capture.Interop==3.2.1",
    "winrt-Windows.Graphics.DirectX==3.2.1",
    "winrt-Windows.Graphics.DirectX.Direct3D11==3.2.1",
    "winrt-Windows.Graphics.DirectX.Direct3D11.Interop==3.2.1",
    "winrt-Windows.Graphics.Imaging==3.2.1",
    "winrt-Windows.Storage.Streams==3.2.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["conversation_copilot"]

[tool.setuptools.package-data]
conversation_copilot = ["assets/*", "assets/audio/*", "assets/f04/*.json", "assets/f04/*.md", "demo/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
